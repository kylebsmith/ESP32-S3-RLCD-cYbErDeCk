name: validate

# The design gate. STLs are only published from a commit where every check
# passes, so a geometry regression cannot reach a printer via this repository.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and a virtual framebuffer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad xvfb
          openscad --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Deliberately a bare `pip install -r`, with no extras and nothing
      # preinstalled beyond the runner image. If requirements.txt is incomplete
      # the gate below dies with a ModuleNotFoundError naming a package no
      # source file imports - which is exactly how this workflow stayed red
      # from its first push. See the note at the top of tools/requirements.txt.
      - name: Install the Python toolchain
        run: |
          pip install -r tools/requirements.txt
          pip list

      # Cloned BEFORE the gate so the reference-facing audit and the structural
      # comparison inside build.sh actually run. Non-fatal: it is a third-party
      # repository CI does not control, and build.sh skips those steps without
      # it rather than failing.
      - name: Fetch the reference design
        continue-on-error: true
        run: git clone --depth 1 https://github.com/nilseuropa/solar_term /tmp/solar_term

      # Renders every part and fails on an OpenSCAD "unknown variable" warning.
      # A deleted parameter does not stop a render - OpenSCAD substitutes undef
      # and quietly produces something small and wrong. Then validates, audits
      # against the reference, and regenerates the drawings and the section
      # analysis.
      - name: Render, validate, audit and draw
        run: ./tools/build.sh

      # Re-derives every [MEASURED] datum from the reference artefacts and
      # asserts the mounting-pattern cross-check between two unrelated designs.
      - name: Reference metrology
        continue-on-error: true
        run: |
          python3 tools/measure_reference.py --reference /tmp/solar_term \
                  --json export/reports/measurements.json

      # -I skips binary files, and the includes restrict this to source. Both
      # matter: without -I this greps the PNGs in docs/img, and the compressed
      # bytes of a render will eventually contain "XXX" by chance. That is not
      # hypothetical - backplate-rear.png did, at byte 29806, and failed this
      # step. A gate whose result depends on how an image happens to compress
      # is worse than no gate, because it teaches you to ignore it.
      # Citations to records that do not exist, holes in the correction
      # sequence, broken cross-document links, and advertised counts that have
      # drifted from what the documents actually contain. C-22, C-23 and C-24
      # were cited by name in the CAD for the whole life of the button and
      # keyboard-rib work and none of the three was ever written; nothing
      # noticed, because nothing was looking.
      # The firmware's window arithmetic, checked on the host. It compiles the
      # shipping header rather than a copy of it, and it asserts that it can
      # tell the correct CASET mirroring apart from the naive version that
      # every full-frame driver gets right by accident. No board needed.
      - name: Check the ST7305 address arithmetic
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
             -I firmware/components/st7305/include \
             -o /tmp/test_st7305_addr tools/test_st7305_addr.c
          /tmp/test_st7305_addr

      # The text grid draws a cell from glyphs pre-turned into the panel's
      # byte order - 36 stores where the per-row path set 288 pixels. That is
      # a claim about the byte layout in all four orientations, and when it is
      # wrong the screen shows legible glyphs in the wrong places. This
      # compiles textgrid.c itself and draws every glyph with every attribute,
      # both faces, all orientations, both ways, onto the same junk, and
      # demands the same bytes; then it breaks the turned face twice (a stale
      # orientation, one wrong bit) and demands the comparison notice.
      - name: Check the pre-turned text face
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-parameter \
             -I firmware/components/textgrid/include \
             -I firmware/components/st7305/include -I tools/hostshim \
             -o /tmp/test_textgrid tools/test_textgrid.c \
             firmware/components/textgrid/font12x24.c \
             firmware/components/textgrid/font6x12.c
          /tmp/test_textgrid

      # The SD mirror wrote every buffer to one file, so switching documents
      # overwrote the previous document's backup - and a '+out' command
      # transcript was mirrored as though it were a document. Each case in
      # this test fails against that behaviour. Same arrangement as above: it
      # includes the shipping header, not a copy.
      - name: Check the SD mirror paths
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
             -I firmware/components/docstore/include \
             -o /tmp/test_mirror_path tools/test_mirror_path.c
          /tmp/test_mirror_path

      # The step -> column mapping the playhead draws with. Like the CASET
      # check above, its job is to tell the correct mapping apart from the
      # naive one (step index == character offset) that every UNSPACED
      # pattern makes look right by accident - which is every pattern in the
      # shipped guide. Run against the naive version it fails 13 ways.
      - name: Check the pattern geometry
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
             -I firmware/components/seq/include \
             -o /tmp/test_seq_pattern tools/test_seq_pattern.c
          /tmp/test_seq_pattern

      # The Strudel conformance corpus (docs/NEXT.md §11): Strudel's own events
      # for every piece of the notation, generated by tools/corpus/gen.mjs, and
      # the shipping compiler has to play the same notes at the same times for
      # the same lengths. Run against the compiler before the step decision, it
      # disagreed on 13 of 51 - nested alternation, every chord, odds on a group.
      - name: Check the deck plays what Strudel plays
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 \
             -I firmware/components/seq/include \
             -o /tmp/test_corpus tools/test_corpus.c
          /tmp/test_corpus tools/corpus/strudel.txt

      # A lane's address has one canonical spelling - 'disc:1' is 'disc' - because
      # the lane table, the playhead and route all look a lane up by it, and a
      # name's definition must refuse what it cannot mean rather than bind a name
      # to the wrong note in every document that uses it.
      - name: Check lane names and definitions
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
             -I firmware/components/cmd/include \
             -o /tmp/test_lane_name tools/test_lane_name.c
          /tmp/test_lane_name

      # The status bar is 30 columns and clips with snprintf, so an over-long
      # message is truncated at the edge of the SENTENCE, not the screen -
      # "not a command - start the line with >" rendered as "not a command -
      # start the line" and the owner could not tell why a line would not run.
      # This reads the shipping header, not a copy.
      - name: Check the on-device strings fit
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
             -I firmware/main -I firmware/components/seq/include \
             -I firmware/components/cmd/include \
             -o /tmp/test_ui_text tools/test_ui_text.c
          /tmp/test_ui_text

      # USB MIDI will move the console and the serial keyboard from
      # USB-Serial-JTAG onto a TinyUSB CDC interface. That is a transport
      # change that must not alter a single key - and the mapping most likely
      # to be lost is the one nobody would guess: a terminal sends CR for
      # Enter, so LF is free, and LF is the ONLY way to reach Ctrl+Enter, the
      # Run verb, down a cable. Every automated test here drives the deck that
      # way. The second check asserts the mapper's constants still equal
      # kbd.h's enum, because a renumbering there would silently turn arrows
      # into characters.
      # The cursor is a solid inverse block and the playhead is a bar; they
      # must compose, because the cell where they meet is exactly the cell the
      # owner is looking at while editing a running lane. The composition was
      # an expression written twice and the blink copy dropped the playhead
      # bit, so every blink erased the bar. Now it is one function, and this
      # binds to it.
      - name: Check the cell attribute composition
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-parameter \
             -I firmware/main -I firmware/components/textgrid/include \
             -I firmware/components/st7305/include -I tools/hostshim \
             -o /tmp/test_cell_attr tools/test_cell_attr.c
          /tmp/test_cell_attr

      # The OSC wire format. A missing pad byte or a little-endian integer
      # produces a datagram a receiver silently discards, and the symptom is
      # "the visuals do not work" with nothing in any log on either side. The
      # second step proves the reference receiver in tools/ parses exactly what
      # the firmware packs - the two halves of the same claim.
      - name: Check the OSC packing
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
             -I firmware/components/net/include \
             -o /tmp/test_osc tools/test_osc.c
          /tmp/test_osc
          python3 - <<'EOF'
          import struct
          src = open('tools/osc_listen.py').read().split('def main()')[0]
          exec(src)
          def s(x):
              b = x.encode() + b'\0'
              return b + b'\0' * ((4 - len(b) % 4) % 4)
          m  = s('/deck/step') + s(',i') + struct.pack('>i', 7)
          m += s('/deck/kick') + s(',ii') + struct.pack('>ii', 36, 100)
          m += s('/deck/frame') + s(',s') + s('hello')
          got = list(parse(m))
          want = [('/deck/step', [7]), ('/deck/kick', [36, 100]),
                  ('/deck/frame', ['hello'])]
          assert got == want, got
          print('[PASS] receiver parses what the firmware packs')
          EOF

      - name: Check the serial keymap
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
             -I firmware/components/kbd/include \
             -o /tmp/test_serialkbd_map tools/test_serialkbd_map.c
          /tmp/test_serialkbd_map
          cc -std=c11 -Wall -Wextra -Werror \
             -I firmware/components/kbd/include -I tools/hostshim \
             -o /tmp/test_keymap_agree tools/test_keymap_agree.c
          /tmp/test_keymap_agree

      # What goes on the wire. A message one byte short desynchronises the
      # receiver's parser and nothing reports it - the drum machine just stops
      # responding. Not observable from the device, so it is checked here.
      - name: Check the MIDI wire format
        run: |
          gcc -std=c11 -Wall -Wextra -O1 \
             -I firmware/components/seq/include \
             -o /tmp/test_midi_wire tools/test_midi_wire.c
          /tmp/test_midi_wire

      # The visual primitives, compiled from the shipping source. Catches a
      # name in the help text with no primitive behind it, a table row that
      # slipped out of order, mirror running before the generators it folds,
      # and rain losing its memory between frames - all of which look like a
      # bad pattern rather than a bug when they happen on the panel.
      - name: Check the visual primitives
        run: |
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -O1 \
             -I firmware/components/viz/include \
             -I firmware/components/seq/include -I tools/hostshim \
             -o /tmp/test_viz tools/test_viz.c firmware/components/viz/viz.c
          /tmp/test_viz

      # The two bitmap faces are generated from reviewable art, never edited
      # by hand. If the committed C and the art disagree, someone edited the
      # wrong one.
      - name: Check the fonts match their art
        run: |
          python3 tools/make_font.py > /tmp/font6x12.c
          diff -u firmware/components/textgrid/font6x12.c /tmp/font6x12.c
          python3 tools/make_font.py --12x24 > /tmp/font12x24.c
          diff -u firmware/components/textgrid/font12x24.c /tmp/font12x24.c
          python3 tools/check_fonts.py

      # The HDMI view node (docs/VIEW.md): frames packed by the deck's
      # view_wire.h must be read by the node's view_read.h - the files the two
      # boards build - including after junk and a torn frame, where the old
      # reader lost the next frame too. And the node's glyphs are generated from
      # the panel's own art, so they are diffed like the panel's faces.
      - name: Check the view node's wire format and its font
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
             -I firmware/main -I view/deckview \
             -o /tmp/test_view_wire tools/test_view_wire.c
          /tmp/test_view_wire
          python3 tools/make_font.py --view > /tmp/deckfont.h
          diff -u view/deckview/deckfont.h /tmp/deckfont.h

      - name: Check the documentation is self-consistent
        run: python3 tools/check_docs.py

      - name: Check no stale TODOs in source or docs
        run: |
          if grep -rnIE '\b(TODO|FIXME|XXX)\b' \
               --include='*.scad' --include='*.md' --include='*.py' \
               --include='*.sh' --include='*.txt' --include='*.yml' \
               cad/ docs/ tools/; then
            echo "::error::unresolved marker in a documented artefact"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyberdeck-stl-and-reports
          path: |
            export/stl/*.stl
            export/reports/*.json
            export/drawings/*.png
          if-no-files-found: warn
