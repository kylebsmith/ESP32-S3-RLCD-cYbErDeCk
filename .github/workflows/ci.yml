name: validate

# The design gate. STLs are only published from a commit where every check
# passes, so a geometry regression cannot reach a printer via this repository.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and a virtual framebuffer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad xvfb
          openscad --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Deliberately a bare `pip install -r`, with no extras and nothing
      # preinstalled beyond the runner image. If requirements.txt is incomplete
      # the gate below dies with a ModuleNotFoundError naming a package no
      # source file imports - which is exactly how this workflow stayed red
      # from its first push. See the note at the top of tools/requirements.txt.
      - name: Install the Python toolchain
        run: |
          pip install -r tools/requirements.txt
          pip list

      # Cloned BEFORE the gate so the reference-facing audit and the structural
      # comparison inside build.sh actually run. Non-fatal: it is a third-party
      # repository CI does not control, and build.sh skips those steps without
      # it rather than failing.
      - name: Fetch the reference design
        continue-on-error: true
        run: git clone --depth 1 https://github.com/nilseuropa/solar_term /tmp/solar_term

      # Renders every part and fails on an OpenSCAD "unknown variable" warning.
      # A deleted parameter does not stop a render - OpenSCAD substitutes undef
      # and quietly produces something small and wrong. Then validates, audits
      # against the reference, and regenerates the drawings and the section
      # analysis.
      - name: Render, validate, audit and draw
        run: ./tools/build.sh

      # Re-derives every [MEASURED] datum from the reference artefacts and
      # asserts the mounting-pattern cross-check between two unrelated designs.
      - name: Reference metrology
        continue-on-error: true
        run: |
          python3 tools/measure_reference.py --reference /tmp/solar_term \
                  --json export/reports/measurements.json

      - name: Check the datum sheet has no stale TODOs
        run: |
          if grep -rnE '\b(TODO|FIXME|XXX)\b' cad/ docs/ tools/; then
            echo "::error::unresolved marker in a documented artefact"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyberdeck-stl-and-reports
          path: |
            export/stl/*.stl
            export/reports/*.json
            export/drawings/*.png
          if-no-files-found: warn
